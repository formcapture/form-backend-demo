# Allow DNS resolution at runtime to handle containers that may not be available at startup
resolver 127.0.0.11 valid=10s;
resolver_timeout 5s;

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_tokens off;
  server_name ${HOSTNAME} nginx;
  return 308 https://$http_host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    client_max_body_size 10M;
    client_header_buffer_size 1024k;
    large_client_header_buffers 4 64k;
    proxy_buffer_size          128k;
    proxy_buffers            4 256k;
    proxy_busy_buffers_size    256k;

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    ssl_certificate "/etc/nginx/certs/_wildcard.${HOSTNAME}.pem";
    ssl_certificate_key "/etc/nginx/certs/_wildcard.${HOSTNAME}-key.pem";

    server_name "app.${HOSTNAME}" nginx;

    location / {
      set $upstream_masterportal "masterportal:80";
      proxy_pass http://$upstream_masterportal;
      autoindex on;
      index index.html;
    }

    location /form-backend/ {
      proxy_pass http://form-backend:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

}

